version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: orderflow_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: orderflow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: orderflow_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus